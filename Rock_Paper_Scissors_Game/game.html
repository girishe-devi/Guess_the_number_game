<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <h1>Welcome to the GAME!</h1>
    <button onclick="
        my_move='Rock';
        comp_move=randomComMove();

        result(my_move,comp_move);
        
    " class="choice"><img src="Images/Rock.png" alt="" class="move"></button>

    <button onclick="
        my_move='Paper';
        comp_move=randomComMove();

        result(my_move,comp_move);
        
    " class="choice"><img src="Images/Paper.png" alt="" class="move"></button>

    <button onclick="

        my_move='Scissors';
        comp_move=randomComMove();

        result(my_move,comp_move);
        
    " class="choice"><img src="Images/Scissors.png" alt="" class="move"></button>

    <P class="score"></P>

    <p class="result"></p>

    <p class="res"></p>

    <button onclick="

        localStorage.removeItem('score');

        score={
            wins : 0,
            losses :0,
            ties :0
        };

        scores();

    ">Reset Score</button>

    <button onclick="
        autoPlay();
    ">Auto Play</button>

    <script>
        
        let my_move='';
        let comp_move='';
        let Result='';

        let score=JSON.parse(localStorage.getItem('score'));

        if(score===null){
            score={
            wins : 0,
            losses :0,
            ties :0
        };
        }

        function randomComMove(){
            let random=Math.random();
            let result='';
            if(random > 0 && random <= (1/3)){
                result='Rock';
            }
            else if(random > (1/3) && random <= (2/3)){
                result='Paper';
            }
            else if(random > (2/3) && random <=1){
                result='Scissors';
            }
            return result;
        }

        function result(user_move,comp_move){
            let final='';


            if(user_move === comp_move){
                final='Tie.'
            }
            else if((user_move==='Rock'&&comp_move==='Paper')||(user_move==='Scissors'&& comp_move==='Rock')||(user_move==='Paper'&&comp_move==='Scissors')){
                final='You Lose.'
            }
            else if((user_move==='Rock'&&comp_move==='Scissors')||(user_move==='Scissors'&& comp_move==='Paper')||(user_move==='Paper'&&comp_move==='Rock')){
                final='You win.'
            }
            
            if(final === 'You win.'){
                score.wins +=1;
            }
            else if(final === 'You Lose.'){
                score.losses +=1;
            }
            else{
                score.ties +=1;
            }

            console.log(user_move,comp_move,final);

            scores();
            report(user_move,comp_move,final);

            localStorage.setItem('score',JSON.stringify(score));
        }

        /*function popup(user_move,comp_move,result){
            alert(`Yours is ${user_move}. I choose ${comp_move}. ${result}
Wins:${score.wins},Losses:${score.losses},Ties:${score.ties}`);
        }*/

        function scores(){
            document.querySelector('.score').innerHTML=`Wins:${score.wins},Losses:${score.losses},Ties:${score.ties}`;
        }

        function report(u_move,c_move,final){
            document.querySelector('.result').innerHTML=`My move <img src="Images/${u_move}.png" class="move">, Comp move <img src="Images/${c_move}.png"class="move">`;

            document.querySelector('.res').innerHTML=final;
        }

        let click=0;
        let temp;
        function autoPlay(){
            if(!click){
                temp=setInterval(function(){
                    let mymove=randomComMove();
                    let comove=randomComMove();
                    result(mymove,comove);
                },2000);
                click=1;
            }
            else{
                clearInterval(temp);
                click=0;
            }

        }

    </script>
</body>
</html>
