<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hamburger Dropdown Menu</title>
</head>
<body>

<!-- Division first -->
<div class="dropdown">
  <!-- Hamburger icon -->
  <span class="hamburger">☰</span>

  <!-- Dropdown menu -->
  <div class="dropdown-content" id="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- Style placed after division, before script -->
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

  /* Hamburger icon */
  .hamburger {
    font-size: 30px;
    cursor: pointer;
    user-select: none;
    padding: 8px;
    background: #333;
    color: white;
    border-radius: 4px;
  }

  /* Dropdown menu container */
  .dropdown {
    position: relative;
    display: inline-block;
  }

  /* Hidden menu */
  .dropdown-content {
    display: none;
    position: absolute;
    top: 45px; /* ensures menu appears below icon */
    left: 0;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    z-index: 1;
    border-radius: 4px;
  }

  .dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
  }

  .dropdown-content a:hover {
    background-color: #ddd;
  }

  /* Show menu when active */
  .show {
    display: block;
  }
</style>

<!-- Script last -->
<script>
  // Toggle menu on click
  document.querySelector(".hamburger").addEventListener("click", function() {
    document.getElementById("menu").classList.toggle("show");
  });

  // Optional: close menu if clicking outside
  window.addEventListener("click", function(event) {
    if (!event.target.matches(".hamburger")) {
      let dropdown = document.getElementById("menu");
      if (dropdown.classList.contains("show")) {
        dropdown.classList.remove("show");
      }
    }
  });
</script>

</body>
</html>
